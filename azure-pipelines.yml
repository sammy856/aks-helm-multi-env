trigger:
  - none

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageRepository: 'axionui-app' # The name of your Docker image in ACR
  dockerRegistryServiceConnection: 'myacrconnection' # Your Azure Container Registry service connection name
  aksServiceConnection: 'aksserviceconnection' # Your AKS cluster service connection name
  helmChartPath: 'helm/my-app' # Path to Helm chart in repo

stages:
- stage: Build
  displayName: Build and Push Docker Image
  jobs:
  - job: BuildJob
    displayName: Build Container
    steps:
    - task: Docker@2
      inputs:
        containerRegistry: '$(dockerRegistryServiceConnection)'
        command: 'login'
    - task: Docker@2
      displayName: Build and Push Docker Image
      inputs:
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(imageRepository)'
        command: 'buildAndPush'
        Dockerfile: '$(Build.SourcesDirectory)/axion-ui/Dockerfile'
        buildContext: '$(Build.SourcesDirectory)/axion-ui'
        tags: |
          $(Build.BuildId)
          latest

    - task: HelmInstaller@1
      displayName: Install Helm
      inputs:
        helmVersionToInstall: '3.11.0'

- stage: DeployToDev
  displayName: Deploy to Dev
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployJob
    displayName: Deploy with Helm to AKS to dev
    environment: 'Dev-aks'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            persistCredentials: true
          - task: HelmInstaller@1
            displayName: Install Helm on Agent
            inputs:
              helmVersionToInstall: '3.11.0'

          - task: HelmDeploy@0
            displayName: Helm Upgrade/Install (Dev)
            inputs:
              connectionType: 'Kubernetes Service Connection'
              kubernetesServiceConnection: 'aksserviceconnection'
              namespace: 'dev'
              command: 'upgrade'
              chartType: 'FilePath'
              chartPath: '$(System.DefaultWorkingDirectory)/$(helmChartPath)'
              releaseName: 'axionui-dev-release'
              overrideValues: 'image.tag=$(Build.BuildId)'
              arguments: '--install --create-namespace -f $(System.DefaultWorkingDirectory)/$(helmChartPath)/values.dev.yaml'

- stage: DeployToQA
  displayName: Deploy to QA
  dependsOn: DeployToDev
  condition: succeeded()
  jobs:
  - deployment: DeployQAJob
    displayName: Deploy with Helm to AKS
    environment: 'QA-aks'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            persistCredentials: true
          - task: HelmInstaller@1
            displayName: Install Helm on Agent
            inputs:
              helmVersionToInstall: '3.11.0'

          - task: HelmDeploy@0
            displayName: Helm Upgrade/Install (QA)
            inputs:
              connectionType: 'Kubernetes Service Connection'
              kubernetesServiceConnection: 'aksserviceconnection'
              namespace: 'qa'
              command: 'upgrade'
              chartType: 'FilePath'
              chartPath: '$(System.DefaultWorkingDirectory)/$(helmChartPath)'
              releaseName: 'axion-qa-release'
              overrideValues: 'image.tag=$(Build.BuildId)'
              arguments: '--install --create-namespace -f $(System.DefaultWorkingDirectory)/$(helmChartPath)/values.qa.yaml'






