apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.name }}-Service
  labels:
    app: {{ .Chart.name }}
spec:
    type: {{ .Values.service.type }}
    selector:
        app: {{ .Chart.name }}
        ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
          targetPort: {{ .Values.service.targetPort }}       